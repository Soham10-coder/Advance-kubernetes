apiVersion: v1
kind: Pod
metadata:
  labels:
    run: pod2
  name: pod1
spec:
  containers:
  - image: polinux/stress
    name: pod
    resources: 
      requests:
        memory: "50Mi"
      limits:
        memory: "150Mi"
    command: ["stress"]
    args: ["--vm","1","--vm-bytes","250M","--vm-hang","1"]
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
