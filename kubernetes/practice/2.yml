apiVersion: apps/v1
kind: Deployment
metadata:
  name: d1
  labels:
    for: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      name: mypod
      labels:
        app: myapp
    spec:
      containers:
      - name: cont1
        image: nginx
        ports:
          - containerPort: 80
